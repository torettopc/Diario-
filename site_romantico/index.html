    function AccessScreen({ onUnlock }) {
      const [password, setPassword] = useState("");
      const [errorMsg, setErrorMsg] = useState("");
      const [isShake, setIsShake] = useState(false);

      const backgroundHearts = [
        { left: "10%", top: "15%", delay: "0s", size: "1.5rem" },

        { left: "15%", top: "75%", delay: "4s", size: "1.2rem" },
        { left: "80%", top: "45%", delay: "0.5s", size: "1rem" },
      ];

      const handleSubmit = (e) => {
        e.preventDefault();
        const correctPassword = "25122025";
        if (password.trim() === correctPassword) {
          onUnlock();
        } else {
          setErrorMsg("Hum... essa não é a nossa data especial. Pense com carinho! 🥺💕");

          setTimeout(() => setIsShake(false), 500);
        }

      return (
        <div className="min-h-screen relative overflow-hidden bg-gradient-to-tr from-rose-50 via-rose-100 to-rose-50 flex flex-col justify-center items-center px-4 py-8">

              className="absolute text-rose-300 animate-float-slow pointer-events-none opacity-40 text-lg"
              style={{
                left: h.left,
                top: h.top,
                animationDelay: h.delay,
                fontSize: h.size,
              }}

              ❤️
            </div>
          ))}

            className={`w-full max-w-sm bg-white/80 backdrop-blur-md rounded-3xl p-8 shadow-xl border border-rose-100 text-center transition-all duration-300 ${

            style={isShake ? { animation: 'float 0.4s ease' } : {}}

            <div className="flex justify-center mb-5">
              <div className="relative bg-rose-100 text-rose-500 p-4 rounded-full animate-pulse-slow">

              Para entrar em nosso diário particular, digite a data que mudou nossas vidas (DDMMAAAA):

              <div className="relative">
                <input

    // COMPONENTE: ÁLBUM DE FOTOS

    function PhotoAlbumSection({ photos, onUpdatePhoto }) {
      const [viewMode, setViewMode] = useState("grid");
      const [lightboxIndex, setLightboxIndex] = useState(null);
      const [carouselIndex, setCarouselIndex] = useState(0);
      const fileInputRef = useRef(null);
      const [editingCardId, setEditingCardId] = useState(null);
      const [tempCaption, setTempCaption] = useState("");

      const handleImageUpload = (photoId, file) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const MAX_WIDTH = 600;
            let width = img.width;
            let height = img.height;

            if (width > MAX_WIDTH) {
              height = Math.round((height * MAX_WIDTH) / width);
              width = MAX_WIDTH;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            if (ctx) {
              ctx.drawImage(img, 0, 0, width, height);
              const dataUrl = canvas.toDataURL("image/jpeg", 0.75);
              const updated = photos.map((p) => (p.id === photoId ? { ...p, userImage: dataUrl } : p));
              onUpdatePhoto(updated);
            }
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      };

      const triggerUpload = (photoId, e) => {
        if (e) e.stopPropagation();
        setEditingCardId(photoId);
        if (fileInputRef.current) fileInputRef.current.click();
      };

      const handleFileChange = (e) => {
        if (e.target.files && e.target.files[0] && editingCardId) {
          handleImageUpload(editingCardId, e.target.files[0]);
        }
      };

      const startEditingCaption = (photo, e) => {
        e.stopPropagation();
        setEditingCardId(photo.id);
        setTempCaption(photo.caption);
      };

      const saveCaption = (photoId, e) => {
        e.stopPropagation();
        const updated = photos.map((p) => p.id === photoId ? { ...p, caption: tempCaption } : p);
        onUpdatePhoto(updated);
        setEditingCardId(null);
      };

      return (
        <div className="space-y-6">
          <input
            type="file"
            ref={fileInputRef}
            onChange={handleFileChange}
            accept="image/*"
            className="hidden"
          />

          {/* Seletor de Modo */}
          <div className="flex justify-between items-center bg-white/60 p-1.5 rounded-2xl border border-rose-100 max-w-sm mx-auto shadow-sm">
            <button
              onClick={() => setViewMode("grid")}
              className={`flex-1 text-center py-2 px-4 rounded-xl font-semibold text-sm transition-all cursor-pointer ${
                viewMode === "grid" ? "bg-rose-500 text-white shadow-sm" : "text-rose-600 hover:bg-rose-50/50"
              }`}
            >
              🖼️ Grade
            </button>
            <button

              className={`flex-1 text-center py-2 px-4 rounded-xl font-semibold text-sm transition-all cursor-pointer ${

    // -----------------------------------------------------
    // COMPONENTE: HISTÓRIA (Cápsula do tempo)
    // -----------------------------------------------------
    function TimelineSection({ milestones, onUpdateMilestones }) {
      const [isAdding, setIsAdding] = useState(false);
      const [date, setDate] = useState("");
      const [title, setTitle] = useState("");
      const [desc, setDesc] = useState("");

      const handleAdd = (e) => {
        e.preventDefault();
        if (!date || !title || !desc) return;
        const added = {
          id: "m_static_" + Date.now().toString(),
          date,
          title,
          description: desc,
          iconType: "heart"
        };
        onUpdateMilestones([...milestones, added]);
        setIsAdding(false);
        setDate(""); setTitle(""); setDesc("");
      };

      const handleDelete = (id) => {
        if (confirm("Quer mesmo apagar essa linda lembrança? 🥺")) {
          onUpdateMilestones(milestones.filter(m => m.id !== id));
        }
      };

      return (
        <div className="space-y-8 max-w-xl mx-auto py-2 text-left">
          <div className="text-center space-y-1.5">
            <h3 className="font-serif text-2xl font-bold text-rose-900">Nossos Capítulos Secretos</h3>
            <p className="text-xs text-gray-500 italic">Cada passo, conquista e beijo marcados para sempre</p>
          </div>

          {!isAdding ? (
            <div className="flex justify-center">
              <button onClick={() => setIsAdding(true)} className="bg-rose-500 text-white font-bold px-4 py-2 rounded-full text-xs flex items-center gap-1 shadow hover:scale-105 transition-all cursor-pointer">
                ➕ Adicionar Novo Capítulo
              </button>
            </div>
          ) : (
            <form onSubmit={handleAdd} className="bg-white p-5 rounded-2xl border border-rose-100 shadow-sm space-y-3">
              <div className="flex justify-between items-center pb-2 border-b border-rose-50">
                <span className="font-serif font-bold text-rose-800 text-xs">Novo Momento</span>
                <button type="button" onClick={() => setIsAdding(false)} className="text-gray-400 hover:text-black">✕</button>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <input type="text" placeholder="Data (Ex: 25/12/2025)" value={date} onChange={e => setDate(e.target.value)} className="text-xs p-2.5 border rounded-lg" required />
                <input type="text" placeholder="Título (Ex: Viagem romântica)" value={title} onChange={e => setTitle(e.target.value)} className="text-xs p-2.5 border rounded-lg" required />
              </div>
              <textarea placeholder="Fale sobre o que tornou esse dia inesquecível..." value={desc} onChange={e => setDesc(e.target.value)} className="text-xs p-2.5 border rounded-lg w-full" rows={3} required />
              <div className="flex justify-end gap-1.5 pt-1">
                <button type="button" onClick={() => setIsAdding(false)} className="px-3 py-1.5 border rounded text-xs">Cancelar</button>
                <button type="submit" className="px-3 py-1.5 bg-rose-500 text-white font-bold rounded text-xs shadow">Registrar</button>
              </div>
            </form>
          )}

          <div className="relative border-l-2 border-rose-100 pl-6 ml-4 space-y-6">
            {milestones.map((m) => (
              <div key={m.id} className="relative group">
                <div className="absolute -left-[35px] top-1 bg-white border-2 border-rose-200 p-1.5 rounded-full shadow-sm">
                  <HeartIcon className="w-3.5 h-3.5 fill-rose-500 stroke-none" />
                </div>
                <div className="bg-white/80 border border-rose-100 p-4.5 rounded-xl hover:shadow-md transition shadow-sm">
                  <div className="flex justify-between items-center mb-1.5">
                    <span className="text-[10px] font-bold text-rose-600 bg-rose-550 px-2 py-0.5 rounded-full border border-rose-150 font-mono flex items-center gap-1 bg-rose-50 leading-none">
                      <CalendarIcon className="w-3 h-3 text-rose-500" /> {m.date}
                    </span>
                    <button onClick={() => handleDelete(m.id)} className="text-gray-300 hover:text-rose-600 transition-colors"><TrashIcon className="w-3.5 h-3.5" /></button>

                  <h4 className="font-serif text-sm font-bold text-rose-950 mb-1">{m.title}</h4>

    // -----------------------------------------------------
    // COMPONENTE: PLANOS FUTUROS (Sonhos)
    // -----------------------------------------------------
    function PlansSection({ plans, onUpdatePlans }) {
      const [newText, setNewText] = useState("");

      const handleToggle = (id) => {
        const updated = plans.map(p => p.id === id ? { ...p, completed: !p.completed } : p);
        onUpdatePlans(updated);
      };

      const handleAdd = (e) => {
        e.preventDefault();
        if (!newText.trim()) return;
        const added = {
          id: "plan_static_" + Date.now().toString(),
          text: newText.trim(),
          completed: false,
          category: "lazer"
        };
        onUpdatePlans([...plans, added]);
        setNewText("");
      };

      const handleDelete = (id, e) => {
        e.stopPropagation();
        onUpdatePlans(plans.filter(p => p.id !== id));
      };

      const compCount = plans.filter(p => p.completed).length;
      const progress = plans.length > 0 ? Math.round((compCount / plans.length) * 100) : 0;

      return (
        <div className="space-y-6 max-w-xl mx-auto py-2 text-left">
          <div className="bg-white/90 p-5 rounded-2xl border border-rose-100 shadow-sm space-y-4">
            <div className="flex justify-between items-center">
              <h3 className="font-serif text-lg font-bold text-rose-900 flex items-center gap-1.5">💫 Nosso Baú de Desejos</h3>
              <span className="text-[10px] font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded-full border">{compCount} de {plans.length} realizados</span>
            </div>
            
            <div className="space-y-1">
              <div className="flex justify-between text-[10px] text-gray-500 px-0.5">
                <span>Sonhos compartilhados concluídos</span>
                <span>{progress}%</span>
              </div>
              <div className="w-full bg-rose-50 rounded-full h-2.5 border overflow-hidden">
                <div className="bg-gradient-to-r from-rose-400 to-rose-500 h-full transition-all duration-300" style={{ width: `${progress}%` }} />
              </div>
            </div>
          </div>

          <div className="space-y-2.5">
            {plans.map((p) => (
              <div
                key={p.id}
                onClick={() => handleToggle(p.id)}
                className={`flex items-center justify-between p-3.5 rounded-xl border transition cursor-pointer ${
                  p.completed ? "bg-rose-50/40 border-rose-100 opacity-70" : "bg-white border-rose-100 hover:border-rose-300"
                }`}
              >
                <div className="flex items-center gap-3">
                  <div className={`p-0.5 rounded-md ${p.completed ? 'bg-rose-550 border-rose-500 text-rose-500' : 'w-4 h-4 rounded border-2 border-rose-200'}`}>
                    {p.completed && <CheckIcon className="w-3.5 h-3.5 text-rose-600 font-bold" />}
                  </div>
                  <span className={`text-xs sm:text-sm font-medium ${p.completed ? 'line-through text-gray-400 font-normal' : 'text-gray-800'}`}>{p.text}</span>
                </div>
                <button onClick={(e) => handleDelete(p.id, e)} className="text-gray-300 hover:text-rose-600 p-1"><TrashIcon className="w-3.5 h-3.5"/></button>
              </div>
            ))}
          </div>

          <form onSubmit={handleAdd} className="bg-white p-4 rounded-xl border border-rose-100 flex gap-2">
            <input
              type="text"
              value={newText}
              onChange={e => setNewText(e.target.value)}
              placeholder="Escreva mais um plano fofo nosso..."
              className="flex-1 text-xs px-3 py-2.5 border rounded-lg focus:outline-none"
              required
            />
            <button type="submit" className="bg-rose-500 text-white font-bold text-xs px-4 py-2 rounded-lg cursor-pointer hover:bg-rose-600 transition shadow">Adicionar</button>
          </form>
        </div>
      );
    }

    // -----------------------------------------------------
    // COMPONENTE PRINCIPAL (MAIN WRAPPER)
    // -----------------------------------------------------
    function MainApp() {
      const [isUnlocked, setIsUnlocked] = useState(false);
      const [activeTab, setActiveTab] = useState("album");
      const [shareUrl, setShareUrl] = useState("");
      const [copied, setCopied] = useState(false);

      const [photos, setPhotos] = useState(DEFAULT_PHOTOS);
      const [milestones, setMilestones] = useState(DEFAULT_MILESTONES);
      const [plans, setPlans] = useState(DEFAULT_FUTURE_PLANS);
      const [declaration, setDeclaration] = useState(DEFAULT_DECLARATION);

      // Relógio Contador de Tempo Juntos
      const [time, setTime] = useState({ d: 0, h: 0, m: 0, s: 0 });

      useEffect(() => {
        // 1. Carrega dados salvos locais se houver
        const savedUnlock = localStorage.getItem("isLoveUnlocked_static");
        if (savedUnlock === "true") setIsUnlocked(true);

        const savedPhotos = localStorage.getItem("love_photos");
        if (savedPhotos) setPhotos(JSON.parse(savedPhotos));

        const savedMilestones = localStorage.getItem("love_milestones");
        if (savedMilestones) setMilestones(JSON.parse(savedMilestones));

        const savedPlans = localStorage.getItem("love_plans");
        if (savedPlans) setPlans(JSON.parse(savedPlans));

        const savedDecl = localStorage.getItem("love_declaration");
        if (savedDecl) setDeclaration(savedDecl);

        // Define link de compartilhamento
        setShareUrl(window.location.href);
      }, []);

      useEffect(() => {
        const annDate = new Date("2025-12-25T00:00:00");
        const interval = setInterval(() => {
          const diff = Date.now() - annDate.getTime();
          if (diff > 0) {
            setTime({
              d: Math.floor(diff / (1000 * 60 * 60 * 24)),
              h: Math.floor((diff / (1000 * 60 * 60)) % 24),
              m: Math.floor((diff / (1000 * 60)) % 60),
              s: Math.floor((diff / 1000) % 60)
            });
          }
        }, 1000);
        return () => clearInterval(interval);
      }, []);

      const savePhotos = (updated) => { setPhotos(updated); localStorage.setItem("love_photos", JSON.stringify(updated)); };
      const saveMilestones = (updated) => { setMilestones(updated); localStorage.setItem("love_milestones", JSON.stringify(updated)); };
      const savePlans = (updated) => { setPlans(updated); localStorage.setItem("love_plans", JSON.stringify(updated)); };
      const saveDecl = (text) => { setDeclaration(text); localStorage.setItem("love_declaration", text); };

      const handleUnlock = () => { setIsUnlocked(true); localStorage.setItem("isLoveUnlocked_static", "true"); };
      const handleLock = () => { if (confirm("Deseja sair do diário secreto? ❤️")) { setIsUnlocked(false); localStorage.removeItem("isLoveUnlocked_static"); } };

      const copyLink = () => {
        navigator.clipboard.writeText(shareUrl);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      if (!isUnlocked) {
        return <AccessScreen onUnlock={handleUnlock} />;
      }

      return (
        <div className="min-h-screen bg-rose-50/50 flex flex-col justify-between selection:bg-rose-200">
          {/* HEADER COM RElÓGIO CONTINUO */}
          <header className="bg-white/80 backdrop-blur sticky top-0 z-40 border-b border-rose-100 py-3 px-5 shadow-sm">
            <div className="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
              <div className="flex items-center gap-2.5">
                <div className="bg-rose-100 text-rose-500 p-2 rounded-full">
                  <HeartIcon className="w-5 h-5 fill-rose-400 stroke-none animate-pulse-slow" />
                </div>
                <div className="text-left">
                  <h1 className="font-serif text-base sm:text-lg font-bold text-rose-900 leading-tight">Nosso Universo</h1>
                  <p className="font-handwritten text-base leading-none text-rose-500">Desde 25/12/2025</p>
                </div>
              </div>

              {/* Relógio Compacto */}
              <div className="flex items-center gap-1.5 bg-rose-50/70 border border-rose-100/80 px-3 py-1.5 rounded-xl text-xs font-mono font-bold text-rose-950">
                <ClockIcon className="w-4 h-4 text-rose-500" />
                <span>{time.d} Dias</span>
                <span className="text-[10px] text-rose-400 px-0.5">e</span>
                <span>{time.h}h</span>
                <span>{time.m}m</span>
                <span>{time.s}s</span>
                <span className="text-[9px] text-rose-600 bg-rose-100/50 px-1 py-0.5 rounded ml-1 animate-pulse uppercase leading-none">Juntos</span>
              </div>

              <button onClick={handleLock} className="text-gray-400 hover:text-rose-500 p-1 rounded-full"><LogOutIcon className="w-4.5 h-4.5"/></button>
            </div>
          </header>

          {/* MENU DE ABAS */}
          <nav className="bg-white border-b border-rose-50 py-2.5 shadow-sm sticky top-[61px] sm:top-[63px] z-30">
            <div className="max-w-xs sm:max-w-md mx-auto grid grid-cols-4 gap-1 select-none">
              {[
                { id: "album", label: "Álbum", emoji: "📸" },
                { id: "declaration", label: "Carta", emoji: "💌" },
                { id: "history", label: "História", emoji: "📖" },
                { id: "plans", label: "Planos", emoji: "✨" }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`flex flex-col items-center justify-center py-2 rounded-xl transition cursor-pointer ${
                    activeTab === tab.id ? 'bg-rose-50 text-rose-600 font-bold scale-[1.03]' : 'text-gray-400 hover:text-rose-500'
                  }`}
                >
                  <span className="text-lg sm:text-xl mb-0.5">{tab.emoji}</span>
                  <span className="text-[10px] sm:text-xs">{tab.label}</span>
                </button>
              ))}
            </div>
          </nav>

          {/* CONTEÚDO PRINCIPAL COM TRANSIÇÕES */}
          <main className="flex-1 max-w-4xl w-full mx-auto px-4 py-8">
            {activeTab === "album" && (
              <div className="space-y-4 animate-fadeIn">
                <div className="text-center space-y-1.5 mb-2">
                  <h2 className="font-serif text-2xl sm:text-3xl font-bold text-rose-950">Nosso Álbum de Recordações</h2>
                  <p className="text-xs sm:text-sm text-gray-500 italic max-w-sm mx-auto">Espaço dedicado para momentos especiais que contam nossa história!</p>
                </div>
                <PhotoAlbumSection photos={photos} onUpdatePhoto={savePhotos} />
              </div>
            )}

            {activeTab === "declaration" && (
              <div className="animate-fadeIn">
                <DeclarationSection declarationText={declaration} onSave={saveDecl} />
              </div>
            )}

            {activeTab === "history" && (
              <div className="animate-fadeIn">
                <TimelineSection milestones={milestones} onUpdateMilestones={saveMilestones} />
              </div>
            )}

            {activeTab === "plans" && (
              <div className="animate-fadeIn">
                <PlansSection plans={plans} onUpdatePlans={savePlans} />
              </div>
            )}
          </main>

          {/* RODAPÉ E FERRAMENTAS */}
          <footer className="bg-white border-t border-rose-100 py-10 px-5 text-center mt-12">
            <div className="max-w-md mx-auto space-y-6">
              
              <div className="bg-rose-50/50 p-5 rounded-2xl border border-rose-100 flex flex-col items-center gap-4">
                <div className="space-y-0.5">
                  <h4 className="font-serif font-bold text-rose-950 text-sm">Compartilhar Nosso Link</h4>
                  <p className="text-[10px] text-gray-400">Escaneie o QR Code abaixo para abrir direto do celular!</p>
                </div>

                {shareUrl && (
                  <div className="bg-white p-3 rounded-xl shadow-md inline-block">
                    <img
                      src={`https://api.qrserver.com/v1/create-qr-code/?size=150x150&color=9F1239&bgcolor=FFFFFF&data=${encodeURIComponent(shareUrl)}`}
                      alt="QR Code"
                      className="w-32 h-32 object-contain"
                    />
                  </div>
                )}

                <div className="w-full flex border border-rose-200 rounded-lg overflow-hidden bg-white">
                  <span className="text-[10px] text-gray-400 select-all truncate flex-1 leading-8 pl-3 text-left self-center">{shareUrl}</span>
                  <button onClick={copyLink} className="bg-rose-500 hover:bg-rose-600 text-white font-bold text-xs px-4 py-2 flex items-center gap-1 cursor-pointer">
                    {copied ? <CheckIcon className="w-3 h-3 stroke-[3]" /> : <CopyIcon className="w-3 h-3" />}
                    <span>{copied ? 'Copiado!' : 'Copiar'}</span>
                  </button>
                </div>
              </div>

              <div className="space-y-1">
                <p className="text-[10px] text-gray-400 leading-relaxed">Este site estático armazena seus uploads e edições localmente com segurança máxima.</p>
                <p className="text-[10px] text-rose-400 font-semibold">Feito para blindar e recordar o nosso amor para sempre. ❤️</p>
              </div>

            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.render(<MainApp />, document.getElementById("root"));
  </script>
</body>
</html>
